<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Chat App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e9edef;
}

.header {
    background: #075e54;
    color: white;
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
}

.status {
    font-size: 13px;
    margin-top: 5px;
    color: #d9fdd3;
}

.container {
    height: calc(100dvh - 140px);
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    background: white;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 85%;
    overflow-wrap: anywhere;
}

.mine {
    background: #d9fdd3;
    margin-left: auto;
}

.time {
    font-size: 10px;
    color: #667781;
    margin-top: 5px;
}

.input-area {
    display: flex;
    gap: 8px;
    background: white;
    padding: 12px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 25px;
    outline: none;
}

button {
    background: #075e54;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 12px 17px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    My Chat
    <div class="status" id="status">Connecting...</div>
</div>

<div class="container">

    <div class="messages" id="messages">
        <div class="message">
            Welcome! 👋
            <div class="time">My Chat App</div>
        </div>
    </div>

    <form class="input-area" id="chatForm">
        <input
            id="messageInput"
            type="text"
            placeholder="Message लिखें..."
            autocomplete="off"
            required
        >

        <button type="submit">Send</button>
    </form>

</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>
/*
  Backend deploy करने के बाद:
  नीचे BACKEND_URL में अपने असली server का HTTPS URL डालें।
*/

const BACKEND_URL = "https://YOUR-BACKEND-URL.example";

const statusElement = document.getElementById("status");
const messagesElement = document.getElementById("messages");
const input = document.getElementById("messageInput");
const form = document.getElementById("chatForm");

let socket = null;

function addMessage(text, mine = false) {
    const message = document.createElement("div");
    message.className = mine ? "message mine" : "message";

    const content = document.createElement("div");
    content.textContent = text;

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = new Date().toLocaleTimeString();

    message.append(content, time);
    messagesElement.appendChild(message);
    messagesElement.scrollTop = messagesElement.scrollHeight;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();

    if (!text) return;

    if (!socket || !socket.connected) {
        alert("Server से कनेक्शन नहीं है।");
        return;
    }

    socket.emit("send_message", {
        text: text
    }, function(response) {
        if (!response || !response.ok) {
            alert("मैसेज नहीं भेजा जा सका।");
        }
    });

    addMessage(text, true);
    input.value = "";
});

function connectBackend() {
    if (
        BACKEND_URL.includes("YOUR-BACKEND-URL") ||
        !window.io
    ) {
        statusElement.textContent =
            "Backend URL सेट करना बाकी है";
        return;
    }

    socket = io(BACKEND_URL, {
        transports: ["websocket", "polling"],
        reconnection: true
    });

    socket.on("connect", function() {
        statusElement.textContent = "Connected";
    });

    socket.on("disconnect", function() {
        statusElement.textContent = "Disconnected";
    });

    socket.on("receive_message", function(message) {
        if (message && typeof message.text === "string") {
            addMessage(message.text);
        }
    });

    socket.on("connect_error", function() {
        statusElement.textContent = "Connection failed";
    });
}

connectBackend();
</script>

</body>
</html>
